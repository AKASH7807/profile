    <!-- ==========================================================================
         CINEMATIC PRE-LOADER (Uiverse / Creative Agency Style)
         ========================================================================== -->
    <div class="loader-container" id="loading">
        <div class="loader-backdrop">
            <div class="loader-glow-orb orb-1"></div>
            <div class="loader-glow-orb orb-2"></div>
            <div class="loader-grid-lines"></div>
        </div>
        <div class="loader-content">
            <div class="loader-card">
                <!-- Spacious Holographic Orbital Spinner -->
                <div class="loader-spinner-wrapper">
                    <div class="loader-orbital-ring ring-outer"></div>
                    <div class="loader-orbital-ring ring-mid"></div>
                    <div class="loader-orbital-ring ring-inner"></div>
                    <div class="loader-core-badge">
                        <span class="loader-monogram">AM</span>
                    </div>
                </div>
                <!-- Neumorphic Branding & Typography -->
                <div class="loader-brand">
                    <h2 class="loader-brand-title">Akash M</h2>
                    <div class="loader-brand-subtitle">
                        <span class="loader-typing-text">PORTFOLIO EXPERIENCE</span>
                    </div>
                </div>
                <!-- Neumorphic Inset Progress Track -->
                <div class="loader-progress-box">
                    <div class="loader-progress-track">
                        <div class="loader-progress-bar" id="loader-progress-bar">
                            <span class="loader-progress-shimmer"></span>
                        </div>
                    </div>
                    <div class="loader-progress-meta">
                        <span class="loader-status" id="loader-status">INITIALIZING...</span>
                        <span class="loader-percentage" id="loader-percentage">0%</span>
                    </div>
                </div>
            </div>
        </div>
        <!-- Cinematic Reveal Curtains -->
        <div class="loader-curtain loader-curtain-top"></div>
        <div class="loader-curtain loader-curtain-bottom"></div>
    </div>

    <!-----===============CONTACT FORM=============--->
    <section class="contact section contact-section">
        <h2 class="section-title">
            Let's Talk <br>
            About Your Project
        </h2>

        <div class="contact-page container grid">
            <form action="" class="contact-form grid" id="contact-form">
                <div class="contact-group grid">
                    <div class="contact-box">
                        <input type="text" name="user-name" id="name" required placeholder="Write Your Name"
                            class="contact-input">
                        <label for="name" class="contact-label">First Name</label>
                    </div>

                    <div class="contact-box">
                        <input type="email" name="user-email" id="email" required placeholder="Write Your Email"
                            class="contact-input">
                        <label for="email" class="contact-label">Email Address</label>
                    </div>

                    <div class="contact-box contact-area">
                        <textarea name="user-message" id="message" required placeholder="Write Your Message"
                            class="contact-input"></textarea>
                        <label for="message" class="contact-label">Message</label>
                    </div>

                    <p class="contact-message" id="contact-message">Message status</p>
                    <button type="submit" class="contact-send btn">Send Message</button>
                </div>
            </form>
        </div>
    </section>
